<!doctype html><html lang="ko"><meta charset="utf-8"><title>이중슬릿 도청 시뮬레이션</title>
<style>body{font-family:Arial,sans-serif;max-width:1100px;margin:20px auto;color:#172033}.panel{padding:12px;background:#f2f5f9;border-radius:8px;margin-bottom:14px}canvas{width:100%;border:1px solid #bbb;background:#fff}button{padding:8px 14px;margin:4px}table{border-collapse:collapse;margin-top:12px}td,th{border:1px solid #bbb;padding:5px 10px}.mainmetric{font-size:1.25em;color:#b00020;font-weight:bold}</style>
<h1>이중슬릿 도청 여부 시뮬레이션</h1>
<div class="panel"><b>고정 조건</b>: 한 구간당 송신 광자 1,000개 · λ=500 nm · 후보 파장 500/505 nm · 슬릿 폭 a=0.10 mm · 슬릿 간격 d=1.00 mm · 거리 L=1.00 m · 상대 위상 φ=0/π · 화면 폭 20 mm · 위치 구간 200개<br><br><label><input id="eve" type="checkbox"> Eve 관찰</label> <label>자연 오차율 <input id="err" type="number" min="0" max="10" step="0.1" value="3" style="width:60px">%</label><br><label>Eve가 빼돌리는 광자 수 <input id="stolen" type="range" min="0" max="100" step="1" value="20" style="width:220px"></label> <span id="stolenVal">20개</span> · Eve 상태 판별 정확도: <b id="accuracy">-</b><br><button id="run">한 구간 생성</button></div>
<canvas id="plot" width="900" height="430"></canvas><p id="summary"></p><table id="table"><tr><th>구간</th><th>상태</th><th>TV 변화량</th><th>판정</th></tr></table>
<script>
const N=1000,B=200,LAM=500e-9,SLIT=.10e-3,GAP=1e-3,DIST=1,SCREEN=.020,PHASE=0,BASE_V=1;$=id=>document.getElementById(id);const ctx=$('plot').getContext('2d');
function sinc(z){return Math.abs(z)<1e-12?1:Math.sin(z)/z}
function probs(V){let w=[];for(let j=0;j<B;j++){let x=-SCREEN/2+SCREEN*(j+.5)/B;let envelope=sinc(Math.PI*SLIT*x/(LAM*DIST))**2;let fringe=1+V*Math.cos(2*Math.PI*GAP*x/(LAM*DIST)+PHASE);w.push(Math.max(0,envelope*fringe));}let s=w.reduce((a,b)=>a+b,0);return w.map(v=>v/s)}
function sample(p){let c=[],a=0;for(const v of p){a+=v;c.push(a)}let n=Array(B).fill(0);for(let k=0;k<N;k++){let u=Math.random(),j=0;while(j<B-1&&u>c[j])j++;n[j]++}return n}
function tv(n,p){let total=n.reduce((a,b)=>a+b,0),pt=p.reduce((a,b)=>a+b,0);return .5*n.reduce((s,v,j)=>s+Math.abs(v/total-p[j]/pt),0)}
function eveAccuracy(m,e){if(m<1)return 25;let states=[];for(const l of [500e-9,505e-9])for(const ph of [0,Math.PI])states.push(noisy(probsFor(l,ph),e));let correct=0,tests=1000;for(let t=0;t<tests;t++){let actual=t%4,counts=sample(states[actual]).map(v=>Math.round(v*m/N));let total=counts.reduce((a,b)=>a+b,0);while(total>m){let j=Math.floor(Math.random()*B);if(counts[j]){counts[j]--;total--}}while(total<m){counts[Math.floor(Math.random()*B)]++;total++}let best=0,bestd=Infinity;states.forEach((p,i)=>{let d=tv(counts,p);if(d<bestd){bestd=d;best=i}});if(best===actual)correct++}return 100*correct/tests}
function probsFor(l,ph){let w=[];for(let j=0;j<B;j++){let x=-SCREEN/2+SCREEN*(j+.5)/B;let env=sinc(Math.PI*SLIT*x/(l*DIST))**2;w.push(Math.max(0,env*(1+Math.cos(2*Math.PI*GAP*x/(l*DIST)+ph))))}let s=w.reduce((a,b)=>a+b,0);return w.map(v=>v/s)}
function rawIntensity(x,V=1){let envelope=sinc(Math.PI*SLIT*x/(LAM*DIST))**2;return Math.max(0,envelope*(1+V*Math.cos(2*Math.PI*GAP*x/(LAM*DIST)+PHASE)))}
function draw(ideal,n){let barScale=2.1/B;ctx.clearRect(0,0,900,430);ctx.strokeStyle='#ddd';for(let y=50;y<400;y+=70){ctx.beginPath();ctx.moveTo(45,y);ctx.lineTo(875,y);ctx.stroke()}let X=j=>50+j*820/B;ctx.strokeStyle='#1261a0';ctx.lineWidth=3;ctx.beginPath();for(let k=0;k<=1200;k++){let x=-SCREEN/2+SCREEN*k/1200,v=rawIntensity(x),px=50+820*k/1200,py=390-v/2.1*330;k?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke();ctx.fillStyle='#e67e22';n.forEach((v,j)=>{let h=v/N/barScale*330*.25;ctx.fillRect(X(j)-2,390-h,4,h)})}
function noisy(p,e){return p.map(v=>(1-e)*v+e/B)}
function randomLoss(n,e){let lost=0;for(let i=0;i<n;i++)if(Math.random()<e)lost++;return lost}
function one(active,count,e){let clean=sample(active),n=clean.map(v=>Math.round(v*count/N)),correction=count-n.reduce((a,b)=>a+b,0);if(correction>0)n[0]+=correction;let errors=Math.round(count*e);for(let k=0;k<errors;k++){let from=Math.floor(Math.random()*B),to=Math.floor(Math.random()*B);if(n[from]>0){n[from]--;n[to]++}}return n}
function run(){let eve=$('eve').checked,e=Math.max(0,Math.min(10,Number($('err').value)||0))/100,stolen=eve?Number($('stolen').value):0,naturalLost=randomLoss(N,e),arrived=Math.max(0,N-stolen-naturalLost),totalLost=stolen+naturalLost,totalErrorRate=100*totalLost/N,ideal=probs(BASE_V),base=probs(BASE_V),normalActual=one(base,N-randomLoss(N,e),0),attackedActual=one(base,arrived,0),d=tv(attackedActual,normalActual),differenceRate=100*d;draw(ideal,attackedActual);$('table').innerHTML=`<tr><th>항목</th><th>값</th></tr><tr><td>파란색 선</td><td>이상적 분포</td></tr><tr><td>차이율 기준</td><td>자연 오차가 있는 Eve 없는 실제 분포</td></tr><tr><td>송신 광자 수</td><td>${N}</td></tr><tr><td>Eve가 빼돌린 광자 수</td><td>${stolen}</td></tr><tr><td>자연 오차로 사라진 광자 수</td><td>${naturalLost}</td></tr><tr><td>Bob 총 도착량</td><td>${arrived}</td></tr><tr><td>전체 손실 광자 수</td><td><b>${totalLost}</b></td></tr><tr><td class="mainmetric">광자 수 기준 전체 오차율</td><td class="mainmetric">${totalErrorRate.toFixed(2)}%</td></tr><tr><td>도착하지 않은 시간 슬롯</td><td>${totalLost}개</td></tr><tr><td>설정 자연 오차율</td><td>${(100*e).toFixed(1)}%</td></tr><tr><td>분포 모양 차이율(보조)</td><td>${differenceRate.toFixed(2)}%</td></tr><tr><td>분포 변화량 TV</td><td>${d.toFixed(4)}</td></tr></table>`;$('summary').innerHTML=`한 구간 결과 | Eve 관찰: ${eve?'있음':'없음'} | Eve 관찰량: ${stolen}개<br><span class="mainmetric">광자 수 기준 전체 오차율: ${totalErrorRate.toFixed(2)}%</span> | Bob 도착량: ${arrived}개<br>분포 모양 차이율(보조): ${differenceRate.toFixed(2)}%`}
function updateStolen(){let m=Number($('stolen').value),e=Math.max(0,Math.min(10,Number($('err').value)||0))/100;$('stolenVal').textContent=m+'개';$('accuracy').textContent=eveAccuracy(m,e).toFixed(1)+'%'}
$('stolen').oninput=updateStolen;$('err').oninput=updateStolen;$('run').onclick=run;updateStolen();run();
</script></html>
